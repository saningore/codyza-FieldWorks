services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fieldworks
      POSTGRES_PASSWORD: fieldworks
      POSTGRES_DB: fieldworks
    ports:
      - "54332:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldworks -d fieldworks"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fieldworks-pg:/var/lib/postgresql/data

volumes:
  fieldworks-pg:
